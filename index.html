<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Maktaba</title>
<meta name="description" content="Al Maktaba, la bibliothèque ouverte d'Al Maydan : livres, films, voix et initiatives, choisis et partagés pour une élévation spirituelle, culturelle et intellectuelle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Amiri:wght@400;700&display=swap">
<style>
/* Al Maktaba — codes Al Maydan : vert #247818, rouge #e40000, papier chaud, Cormorant Garamond et Spectral.
   Mise en page : beaucoup de blanc, peu de mots par écran ; les couvertures typographiques portent l'image du site. */
:root {
  --green: #247818; --green-d: #1a5810; --green-t: #edf3ea; --green-t2: #dfe9da;
  --red: #e40000;
  --ink: #1c1b16; --ink-soft: #4b4940; --muted: #837e6e; --faint: #aaa596;
  --paper: #fbfaf5; --paper-2: #f3efe4; --card: #ffffff;
  --line: #e6e1d4; --line-2: #d6d0bf;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --text: "Spectral", Georgia, serif;
  --arabic: "Amiri", "Noto Naskh Arabic", serif;
  --maxw: 1200px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 18px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
::selection { background: var(--green-t2); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
em { font-style: italic; }
[lang="ar"] { font-family: var(--arabic); letter-spacing: 0; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--green); }
.kicker [lang="ar"] { font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--red); font-weight: 700; }
.lede { font-size: clamp(18px, 1.6vw, 21px); color: var(--ink-soft); max-width: 46ch; }
.note { font-size: 15px; color: var(--muted); font-style: italic; }

/* Marque */
.mark { display: block; flex: none; }
.mk-fill { fill: var(--green); }
.mk-cut { fill: var(--paper); }
.mark.on-dark .mk-fill { fill: #fff; }
.mark.on-dark .mk-cut { fill: var(--green); }
.brand { display: inline-flex; align-items: center; gap: 12px; }
.brand-name { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1; }
.brand-ar { font-size: 19px; color: var(--red); line-height: 1; margin-top: 4px; }
.brand.on-dark .brand-name { color: #fff; }
.brand.on-dark .brand-ar { color: #f2c9c2; }

/* En-tête */
.site-head { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.head-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 72px; }
.head-nav { display: flex; align-items: center; gap: 30px; }
.navlink { font-size: 15.5px; color: var(--ink-soft); position: relative; padding-block: 4px; }
.navlink:hover { color: var(--ink); }
.navlink.active { color: var(--green); }
.navlink.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--green); }
.burger { display: none; width: 44px; height: 44px; border: 1px solid var(--line-2); border-radius: 50%; background: transparent; place-items: center; color: var(--ink); }
.drawer { position: fixed; inset: 0; z-index: 60; background: rgba(28, 27, 22, .35); }
.drawer-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(86vw, 340px); background: var(--paper); padding: calc(20px + env(safe-area-inset-top, 0px)) 24px 24px; display: flex; flex-direction: column; }
.drawer-panel .burger { display: grid; align-self: flex-end; margin-bottom: 18px; }
.drawer-link { font-family: var(--display); font-size: 27px; padding: 12px 0; border-bottom: 1px solid var(--line); }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; padding: 11px 20px; border-radius: 3px; border: 1px solid transparent; white-space: nowrap; transition: background .18s, color .18s, border-color .18s; }
.btn svg { transition: transform .2s; }
.btn:hover svg { transform: translateX(3px); }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-d); }
.btn-quiet { color: var(--ink); border-color: var(--line-2); background: transparent; }
.btn-quiet:hover { border-color: var(--ink); }
.btn-lg { padding: 14px 26px; font-size: 16px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 96px); align-items: center; padding-block: clamp(48px, 8vw, 110px) clamp(40px, 6vw, 80px); }
.hero-text { display: grid; gap: 26px; justify-items: start; }
.hero-h { font-size: clamp(54px, 9.5vw, 128px); line-height: .92; letter-spacing: -0.025em; font-weight: 600; }
.hero-h em { color: var(--green); font-weight: 600; }
.hero-feature { display: grid; gap: 14px; justify-self: end; width: min(100%, 360px); }
.hero-feature .kicker { color: var(--muted); }
.hero-feature .cover { transform: rotate(1.5deg); transition: transform .3s; box-shadow: 0 30px 50px -30px rgba(28, 27, 22, .35); }
.hero-feature:hover .cover { transform: rotate(0deg) translateY(-4px); }

.shelf { display: flex; flex-wrap: wrap; gap: 6px 26px; justify-content: center; padding-block: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.shelf-item { font-family: var(--display); font-size: 22px; font-weight: 500; display: inline-flex; align-items: center; gap: 9px; color: var(--ink-soft); transition: color .15s; }
.shelf-item:hover { color: var(--green); }
.shelf-item sup { font-family: var(--text); font-size: 12px; color: var(--faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #b08948; }
.dot[data-tint="green"] { background: var(--green); }
.dot[data-tint="slate"] { background: #6f7d6a; }
.dot[data-tint="rose"] { background: #b0605a; }

.section { padding-block: clamp(56px, 8vw, 104px); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 34px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(32px, 4vw, 48px); }
.more { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--green); }

.devise { background: var(--green); color: #fff; }
.devise .wrap { display: grid; justify-items: center; text-align: center; gap: 22px; padding-block: clamp(64px, 9vw, 120px); }
.devise p { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 4.6vw, 60px); line-height: 1.1; max-width: 20ch; letter-spacing: -0.01em; }
.devise em { color: #cfe3c8; }

.contribute { display: grid; justify-items: center; text-align: center; gap: 22px; }
.contribute h2 { font-size: clamp(34px, 5vw, 60px); max-width: 16ch; }

/* Couvertures */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(18px, 2.4vw, 32px); }
.card { display: block; }
.card .cover { transition: transform .25s, box-shadow .25s; }
.card:hover .cover { transform: translateY(-5px); box-shadow: 0 22px 36px -24px rgba(28, 27, 22, .4); }
.cover { position: relative; aspect-ratio: 3 / 4; background: var(--paper-2); border-radius: 3px; padding: 10px; }
.cover[data-tint="green"] { background: var(--green-t); }
.cover[data-tint="slate"] { background: #e9eeec; }
.cover[data-tint="sand"] { background: #f2ebdb; }
.cover[data-tint="rose"] { background: #f3e6e1; }
.cover-frame { height: 100%; border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 1px; padding: 16px 16px 14px; display: flex; flex-direction: column; position: relative; }
.cover[data-tint="green"] .cover-frame { border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.cover-type { font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.cover-title { margin-top: auto; font-family: var(--display); font-weight: 600; font-size: clamp(19px, 1.7vw, 25px); line-height: 1.05; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cover-author { margin-top: 8px; font-size: 13px; font-style: italic; color: var(--ink-soft); padding-right: 22px; }
.cover-mark { position: absolute; right: 12px; bottom: 12px; opacity: .55; }
.cover .cover-mark .mk-cut { fill: var(--paper-2); }
.cover-date { margin-top: 18px; display: grid; }
.cover-date .d { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: .85; color: var(--green); }
.cover-date .m { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
.cover.big .cover-title { font-size: clamp(26px, 2.6vw, 36px); }
.cover.big .cover-frame { padding: 22px; }
.ribbon { position: absolute; top: 18px; right: -4px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px 4px 12px; color: #fff; border-radius: 2px 0 0 2px; }
.ribbon.coup { background: var(--red); }
.ribbon.dec { background: var(--green); }

/* Pages */
.page { padding-block: clamp(36px, 6vw, 76px) clamp(60px, 9vw, 120px); }
.page-head { display: grid; gap: 16px; margin-bottom: 38px; }
.page-head h1 { font-size: clamp(44px, 7vw, 88px); line-height: 1; letter-spacing: -0.02em; }
.page-head h1 em { color: var(--green); }
.lib-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.search { flex: 1 1 320px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-2); border-radius: 100px; padding: 11px 18px; background: var(--card); color: var(--muted); min-width: 0; }
.search:focus-within { border-color: var(--green); }
.search input { border: 0; outline: none; background: none; width: 100%; min-width: 0; font-size: 16px; color: var(--ink); }
.select { border: 1px solid var(--line-2); border-radius: 100px; padding: 11px 16px; background: var(--card); font-size: 15px; color: var(--ink-soft); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
.pill { border: 1px solid var(--line-2); background: transparent; border-radius: 100px; padding: 6px 15px; font-size: 14.5px; color: var(--ink-soft); transition: all .15s; }
.pill:hover { border-color: var(--ink); color: var(--ink); }
.pill.on { background: var(--green); border-color: var(--green); color: #fff; }
.lib-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.empty { padding-block: 60px; display: grid; justify-items: center; gap: 16px; text-align: center; }
.empty-h { font-family: var(--display); font-size: 32px; }

.back { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); margin-bottom: 30px; }
.back:hover { color: var(--ink); }
.detail { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
.detail-cover { position: sticky; top: 100px; }
.detail-text { display: grid; gap: 20px; justify-items: start; }
.detail-text h1 { font-size: clamp(38px, 5.4vw, 66px); line-height: 1.02; letter-spacing: -0.02em; }
.detail-author { font-family: var(--display); font-style: italic; font-size: 24px; color: var(--ink-soft); margin-top: -6px; }
.detail-desc { font-size: clamp(18px, 1.5vw, 20px); line-height: 1.7; color: var(--ink-soft); max-width: 60ch; }
.facts { display: flex; flex-wrap: wrap; gap: 14px 36px; margin: 6px 0 0; padding-block: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); width: 100%; }
.facts dt { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.facts dd { margin: 2px 0 0; font-family: var(--display); font-size: 21px; font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 14px; color: var(--ink-soft); border: 1px solid var(--line-2); border-radius: 100px; padding: 5px 13px; }
.tag:hover { border-color: var(--green); color: var(--green); }
.related { padding-bottom: 0; }

.form form { display: grid; gap: 24px; max-width: 680px; }
.field { display: grid; gap: 8px; }
.field label { font-size: 15px; font-weight: 600; }
.field .pills { margin: 0; }
.control { width: 100%; padding: 13px 15px; background: var(--card); border: 1px solid var(--line-2); border-radius: 3px; font-size: 16px; }
.control:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-t); }
textarea.control { min-height: 130px; resize: vertical; line-height: 1.55; }
.hint { font-size: 14px; color: var(--muted); }
.errmsg { font-size: 14px; color: var(--red); }
.field.err .control { border-color: var(--red); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form button[type="submit"] { justify-self: start; }
.done { display: grid; justify-items: center; text-align: center; gap: 20px; }
.done h1 { font-size: clamp(48px, 7vw, 80px); }
.seal { width: 76px; height: 76px; border-radius: 50%; background: var(--green-t); color: var(--green); display: grid; place-items: center; }

.about .axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(24px, 4vw, 56px); padding-block: 40px 56px; border-top: 1px solid var(--line); }
.axis { display: grid; gap: 10px; align-content: start; border-top: 3px solid var(--green); padding-top: 18px; }
.axis:nth-child(2) { border-top-color: var(--red); }
.axis h2 { font-size: 34px; }
.axis p { color: var(--ink-soft); }
.how { display: grid; gap: 22px; justify-items: start; max-width: 680px; }
.how h2 { font-size: clamp(30px, 3.6vw, 42px); }
.how ol { margin: 0; padding-left: 22px; display: grid; gap: 12px; color: var(--ink-soft); }
.how b { color: var(--ink); font-weight: 600; }

/* Pied */
.site-foot { background: var(--green); color: #e6f0e2; margin-top: 0; }
.foot-inner { display: grid; grid-template-columns: minmax(0, 1.6fr) auto auto; gap: 40px; align-items: start; padding-block: 56px 40px; }
.foot-brand { display: grid; gap: 18px; }
.foot-devise { font-family: var(--display); font-size: clamp(22px, 2.4vw, 30px); line-height: 1.15; color: #fff; max-width: 22ch; }
.foot-devise em { color: #cfe3c8; }
.foot-links { display: grid; gap: 8px; font-size: 15.5px; }
.foot-links a:hover { text-decoration: underline; text-underline-offset: 3px; }
.social { display: flex; gap: 10px; }
.social a { width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, .35); border-radius: 50%; display: grid; place-items: center; color: #fff; }
.social a:hover { background: rgba(255, 255, 255, .14); }
.foot-bottom { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid rgba(255, 255, 255, .2); padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); font-size: 14px; color: #bdd6b5; }
.foot-bottom [lang="ar"] { font-size: 17px; }

@media (max-width: 960px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-feature { justify-self: start; width: min(100%, 300px); }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .detail-cover { position: static; max-width: 280px; }
  .about .axes { grid-template-columns: minmax(0, 1fr); }
  .foot-inner { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .head-nav { display: none; }
  .burger { display: grid; }
  .shelf { justify-content: flex-start; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .brand-ar { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
